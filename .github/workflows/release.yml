name: Release

# Builds, signs and publishes a Windows release of LimitScope.
#
# Distribution model (docs/updater-production.md): the installed app reads a
# public, credential-free update feed hosted as release assets on the
# public companion repository datawarsaw/limitscope-releases. The source
# repository holds the source and signing secrets; only the signed installer,
# signature, and latest.json are published to the companion.
#
# Validation and release use independent GitHub-hosted runners, without shared
# caches or validation artifacts. Publication stages and verifies a draft before activation.
#
# Hardened pre-RC (v0.8):
#   - Tag/ref/HEAD identity: the run must check out GITHUB_SHA, the operator
#     must pass the exact expected_head_sha, and the source tag v<version>
#     must resolve to that same commit.
#   - Version-surface agreement: package.json, src-tauri/tauri.conf.json,
#     src-tauri/Cargo.toml and src-tauri/Cargo.lock must all carry the
#     requested version; productName/mainBinaryName must stay LimitScope.
#   - Exact artifact selection: the installer is addressed by its exact
#     LimitScope_<version>_x64-setup.exe name; the bundle directory must
#     contain exactly one installer, and no glob/substring selection exists.
#   - Traceability: SHA-256 + byte sizes are recorded for the installer and
#     signature in release-artifacts-manifest.txt (run summary + workflow
#     artifact). The manifest is NOT published to the public feed repo — the
#     companion release carries exactly installer, signature, latest.json.
#
# Release channels (docs/updater-production.md "Public RC channel"):
# The channel is DERIVED from the version shape — there is no operator
# toggle. A stable x.y.z version publishes exactly as before. An
# x.y.z-rc.N version (e.g. 0.8.7-rc.1) publishes the same companion
# release, but created with --prerelease from the initial creation call:
#   - The isolation primitive is that GitHub releases/latest excludes
#     prereleases, so stable clients polling
#     releases/latest/download/latest.json can never see an RC. The
#     prerelease flag is therefore set atomically at creation and asserted
#     BEFORE any asset is uploaded; make_latest=false is pinned as a second
#     lock (GitHub REST API: drafts and prereleases cannot be set as latest).
#   - The RC's latest.json is an asset of the RC release only; there is no
#     global RC feed pointer. RC installers are manual-download artifacts.
#   - Malformed versions (neither x.y.z nor x.y.z-rc.N) fail the run.
# scripts/verify-release-integrity.mjs --rc is the post-publication RC
# verifier; the local harness scripts/update-harness.mjs remains the
# fully local, signed update loop (127.0.0.1 feed, no production contact).
#
# MANUAL SETUP REQUIRED BEFORE THE FIRST RUN (see docs/updater-production.md):
#   1. Create the public companion repo datawarsaw/limitscope-releases.
#   2. Add secret TAURI_SIGNING_PRIVATE_KEY (contents of limitscope.key).
#   3. Add secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#   4. Add secret RELEASES_PAT — fine-grained PAT with contents:read/write
#      on datawarsaw/limitscope-releases only. It is NOT embedded in the
#      app; only this workflow uses it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: stable x.y.z (e.g. 0.8.7) or RC x.y.z-rc.N (e.g. 0.8.7-rc.1); must match every version surface'
        required: true
        type: string
      expected_head_sha:
        description: 'Exact full commit SHA the release must be built from (tag v<version> must point at it)'
        required: true
        type: string
      notes:
        description: 'Short release notes shown by the in-app updater'
        required: false
        type: string
        default: 'Stability improvements.'

# Least privilege: the workflow token only reads this repository. Publishing
# to the companion repository uses RELEASES_PAT, which is scoped there only.
permissions:
  contents: read

concurrency:
  group: limitscope-publication
  cancel-in-progress: false

jobs:
  validation:
    name: Validate exact source without release credentials
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify requested commit
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install and verify npm
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm12" npm@12.0.2 --ignore-scripts
          export PATH="$(cygpath -u "$RUNNER_TEMP")/npm12:$PATH"
          test "$(node --version)" = v24.19.0
          test "$(npm --version)" = 12.0.2
          echo "$RUNNER_TEMP/npm12" >> "$GITHUB_PATH"
      - name: Install frontend dependencies with strict script approval
        run: npm ci --strict-allow-scripts
      - name: Setup pinned Rust 1.98.1 (MSVC)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Check release workflow isolation
        run: node --test scripts/release-workflow-check.mjs
      - name: Frontend tests
        run: npm test
      - name: Test interrupted publication without network
        run: npm test -- scripts/publish-release.test.mjs
      - name: Frontend build
        run: npm run build
      - name: Secret scan
        run: npm run scan:secrets

  windows:
    name: Build, sign, verify and publish update feed
    needs: validation
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PUBLIC_FEED_REPO: datawarsaw/limitscope-releases
      VERSION: ${{ inputs.version }}
      TZ: Europe/Warsaw

    steps:
      # The source repository is public, so tag lookup does not need a token
      # persisted in .git/config for later steps.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The release channel is derived from the version shape, never chosen:
      #   x.y.z        -> stable (unchanged publication path)
      #   x.y.z-rc.N   -> RC     (companion release created with --prerelease)
      # Anything else fails the run — versions are never reinterpreted.
      - name: Derive release channel from version
        shell: bash
        run: |
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "RELEASE_CHANNEL=rc" >> "$GITHUB_ENV"
            echo "RC channel: version $VERSION publishes as a GitHub prerelease (releases/latest isolation)."
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_CHANNEL=stable" >> "$GITHUB_ENV"
            echo "Stable channel: version $VERSION publishes as the live latest release."
          else
            echo "FAIL: version '$VERSION' is neither a stable x.y.z nor an RC x.y.z-rc.N version."
            echo "Refusing to reinterpret it; fix the version surfaces and re-dispatch."
            exit 1
          fi

      - name: Verify tag/ref/HEAD identity
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "checkout HEAD:    $ACTUAL_SHA"
          echo "workflow SHA:     $GITHUB_SHA"
          echo "requested SHA:    $EXPECTED_HEAD_SHA"
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FAIL: expected_head_sha input is required."
            exit 1
          fi
          if [ "$ACTUAL_SHA" != "$GITHUB_SHA" ]; then
            echo "FAIL: checked-out HEAD ($ACTUAL_SHA) != workflow run commit (GITHUB_SHA=$GITHUB_SHA)"
            exit 1
          fi
          if [ "$ACTUAL_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "FAIL: checked-out HEAD ($ACTUAL_SHA) != requested expected_head_sha ($EXPECTED_HEAD_SHA)"
            exit 1
          fi
          git fetch --force origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          TAG_SHA=$(git rev-parse "v$VERSION^{commit}")
          echo "tag v$VERSION ->  $TAG_SHA"
          if [ "$TAG_SHA" != "$ACTUAL_SHA" ]; then
            echo "FAIL: tag v$VERSION points at $TAG_SHA, not the release HEAD $ACTUAL_SHA"
            exit 1
          fi

      - name: Verify all version surfaces agree
        shell: bash
        run: |
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && $1=="version" {gsub(/"/,"",$3); print $3; exit}' src-tauri/Cargo.toml)
          LOCK_VERSION=$(node -e '
            const lock = require("fs").readFileSync("src-tauri/Cargo.lock", "utf8");
            const m = lock.match(/\[\[package\]\]\s*name = "rate-limits"\s*version = "([^"]+)"/);
            if (!m) { console.error("rate-limits package not found in src-tauri/Cargo.lock"); process.exit(1); }
            console.log(m[1]);
          ')
          NPM_LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          NPM_ROOT_VERSION=$(node -p "require('./package-lock.json').packages[''].version")
          PRODUCT_NAME=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          MAIN_BINARY=$(node -p "require('./src-tauri/tauri.conf.json').mainBinaryName")
          fail=false
          for surface in \
            "src-tauri/tauri.conf.json $CONF_VERSION" \
            "package.json $PKG_VERSION" \
            "package-lock.json $NPM_LOCK_VERSION" \
            "package-lock.json:root $NPM_ROOT_VERSION" \
            "src-tauri/Cargo.toml $CARGO_VERSION" \
            "src-tauri/Cargo.lock $LOCK_VERSION"
          do
            name=$(echo "$surface" | awk '{print $1}')
            value=$(echo "$surface" | awk '{print $2}')
            echo "$name -> $value"
            if [ "$value" != "$VERSION" ]; then
              echo "FAIL: $name version ($value) != requested version ($VERSION)"
              fail=true
            fi
          done
          echo "productName -> $PRODUCT_NAME; mainBinaryName -> $MAIN_BINARY"
          if [ "$PRODUCT_NAME" != "LimitScope" ] || [ "$MAIN_BINARY" != "LimitScope" ]; then
            echo "FAIL: installer-name contract requires productName/mainBinaryName == LimitScope"
            fail=true
          fi
          if [ "$fail" = true ]; then
            echo "Bump every version surface to $VERSION and re-tag before dispatching this workflow."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Install and verify npm
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm12" npm@12.0.2 --ignore-scripts
          export PATH="$(cygpath -u "$RUNNER_TEMP")/npm12:$PATH"
          test "$(node --version)" = v24.19.0
          test "$(npm --version)" = 12.0.2
          echo "$RUNNER_TEMP/npm12" >> "$GITHUB_PATH"

      - name: Install frontend dependencies with strict script approval
        run: npm ci --strict-allow-scripts

      - name: Setup pinned Rust 1.98.1 (MSVC)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: 1.98.1

      - name: Verify tracked source and lockfiles after installation
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build unsigned NSIS installer with locked Cargo dependencies
        shell: bash
        run: npm run tauri build -- --no-sign -- --locked

      - name: Sign exact installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          INSTALLER="src-tauri/target/release/bundle/nsis/LimitScope_${VERSION}_x64-setup.exe"
          test -f "$INSTALLER"
          test ! -e "${INSTALLER}.sig"
          ./node_modules/.bin/tauri signer sign --app-version "$VERSION" "$INSTALLER"

      # Exact artifact selection: address the installer by its exact name and
      # require the bundle directory to hold exactly one installer, so no
      # glob/substring matching can pick a wrong or stale artifact.
      - name: Resolve exact release artifacts
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle/nsis"
          INSTALLER_NAME="LimitScope_${VERSION}_x64-setup.exe"
          INSTALLER_PATH="$BUNDLE_DIR/$INSTALLER_NAME"
          SIG_PATH="${INSTALLER_PATH}.sig"
          if [ ! -f "$INSTALLER_PATH" ]; then
            echo "FAIL: expected installer not found: $INSTALLER_PATH"
            ls -la "$BUNDLE_DIR" || true
            exit 1
          fi
          if [ ! -f "$SIG_PATH" ]; then
            echo "FAIL: expected signature not found: $SIG_PATH"
            exit 1
          fi
          INSTALLER_COUNT=$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*_x64-setup.exe' | wc -l)
          if [ "$INSTALLER_COUNT" -ne 1 ]; then
            echo "FAIL: expected exactly one installer in $BUNDLE_DIR, found $INSTALLER_COUNT:"
            find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*_x64-setup.exe'
            exit 1
          fi
          {
            echo "INSTALLER_NAME=$INSTALLER_NAME"
            echo "INSTALLER_PATH=$INSTALLER_PATH"
            echo "SIG_PATH=$SIG_PATH"
          } >> "$GITHUB_ENV"
          echo "Resolved exact release artifacts: $INSTALLER_PATH (+ .sig)"

      - name: Record artifact SHA-256 and sizes
        shell: bash
        run: |
          INSTALLER_SHA256=$(sha256sum "$INSTALLER_PATH" | awk '{print $1}')
          INSTALLER_SIZE=$(wc -c < "$INSTALLER_PATH" | tr -d '[:space:]')
          SIG_SHA256=$(sha256sum "$SIG_PATH" | awk '{print $1}')
          SIG_SIZE=$(wc -c < "$SIG_PATH" | tr -d '[:space:]')
          if [ -z "$INSTALLER_SHA256" ] || [ "$INSTALLER_SIZE" -le 0 ] || [ -z "$SIG_SHA256" ] || [ "$SIG_SIZE" -le 0 ]; then
            echo "FAIL: hashing failed or an artifact is empty"
            exit 1
          fi
          cat > release-artifacts-manifest.txt <<EOF
          LimitScope $VERSION release artifact manifest
          installer: $INSTALLER_NAME
          installer_sha256: $INSTALLER_SHA256
          installer_bytes: $INSTALLER_SIZE
          signature: $INSTALLER_NAME.sig
          signature_sha256: $SIG_SHA256
          signature_bytes: $SIG_SIZE
          source_sha: $GITHUB_SHA
          generated_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          {
            echo "INSTALLER_SHA256=$INSTALLER_SHA256"
            echo "INSTALLER_SIZE=$INSTALLER_SIZE"
            echo "SIG_SHA256=$SIG_SHA256"
            echo "SIG_SIZE=$SIG_SIZE"
          } >> "$GITHUB_ENV"
          echo "Artifact manifest:"
          cat release-artifacts-manifest.txt >> "$GITHUB_STEP_SUMMARY"
          cat release-artifacts-manifest.txt

      - name: Scan build outputs for secrets
        run: npm run scan:secrets

      # Prepare locally; all three assets are verified on a private draft
      # before one activation changes the public updater target.
      - name: Generate update feed metadata
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          const version = process.env.VERSION;
          const installerPath = process.env.INSTALLER_PATH;
          const installerName = process.env.INSTALLER_NAME;
          const expectedPath = "src-tauri/target/release/bundle/nsis/" + installerName;
          if (installerPath !== expectedPath) {
            console.error("installer path mismatch: " + installerPath + " != " + expectedPath);
            process.exit(1);
          }
          if (!fs.existsSync(installerPath) || !fs.existsSync(installerPath + ".sig")) {
            console.error("missing exact release artifacts: " + installerPath);
            process.exit(1);
          }
          const signature = fs.readFileSync(installerPath + ".sig", "utf8").trim();
          if (!signature) { console.error("empty updater signature"); process.exit(1); }
          const asset = encodeURIComponent(installerName).replace(/%2F/g, "/");
          const feed = {
            version,
            pub_date: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
            notes: process.env.RELEASE_NOTES || "Stability improvements.",
            platforms: {
              "windows-x86_64": {
                signature,
                url: "https://github.com/" + process.env.PUBLIC_FEED_REPO + "/releases/download/v" + version + "/" + asset,
              },
            },
          };
          fs.writeFileSync("latest.json", JSON.stringify(feed, null, 2) + "\n");
          console.log("latest.json generated ->", feed.platforms["windows-x86_64"].url);
          console.log("installer sha256:", process.env.INSTALLER_SHA256);
          '
        env:
          RELEASE_NOTES: ${{ inputs.notes }}

      - name: Verify updater signature before publication
        run: node scripts/verify-release-signature.mjs

      - name: Stage complete draft, verify bytes, then activate
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: node scripts/publish-release.mjs

      - name: Upload artifacts to this workflow run (traceability)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: limitscope-signed-release
          path: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.SIG_PATH }}
            latest.json
            release-artifacts-manifest.txt
          if-no-files-found: error

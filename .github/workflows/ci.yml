name: CI

# Fast, always-on gates plus a conditional NSIS bundling verification.
#
# Job `windows` proves on every push to `main` and every pull request that the
# app installs, tests, builds and ships no secrets. Job
# `bundling-verification` re-runs the full Tauri NSIS bundle build
# ONLY when a bundling-specific input changed (see scripts/ci-bundling-gate.mjs
# and docs/ci-and-release.md "Bundling verification gate").
#
# CI does not sign binaries, publish releases, push tags, or use repository
# secrets. Release publication stays in .github/workflows/release.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build & tests
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Warsaw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install and verify npm
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm12" npm@12.0.2 --ignore-scripts
          export PATH="$(cygpath -u "$RUNNER_TEMP")/npm12:$PATH"
          test "$(node --version)" = v24.19.0
          test "$(npm --version)" = 12.0.2
          echo "$RUNNER_TEMP/npm12" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci --strict-allow-scripts

      - name: Setup stable Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests (live tests are #[ignore]d)
        working-directory: src-tauri
        run: cargo test --locked

      - name: Frontend tests
        run: npm test

      - name: Frontend build (tsc + vite)
        run: npm run build

      - name: Secret scan of build outputs
        run: npm run scan:secrets

  # Decides whether bundling-specific inputs changed. Runs for both pull
  # requests and pushes to `main`; the changed-path computation is shared so
  # the gate cannot silently apply to pull requests only.
  bundling-inputs:
    name: Detect bundling-input changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_bundling: ${{ steps.detect.outputs.run_bundling }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the previous tip of a pushed ref and the base
          # branch of a pull request are both available for the diff.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Detect changed bundling inputs
        id: detect
        shell: bash
        run: |
          # No `set -e`: a failed fetch or diff must fall through to the
          # fail-closed branch instead of aborting the step (which would skip
          # the bundling verification).
          set -uo pipefail

          before="${{ github.event.before }}"
          base_ref="${{ github.base_ref }}"
          zero_sha="0000000000000000000000000000000000000000"
          paths_file="$(mktemp)"
          detected=0

          if [ -n "${base_ref}" ]; then
            # pull_request: diff the PR head against the base branch tip.
            if git fetch --no-tags origin \
                 "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}" \
               && git diff --name-only "origin/${base_ref}...HEAD" > "${paths_file}"; then
              detected=1
            fi
          elif [ -n "${before}" ] && [ "${before}" != "${zero_sha}" ] \
               && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            # push: diff the previous tip of this ref against HEAD.
            if git diff --name-only "${before}" HEAD > "${paths_file}"; then
              detected=1
            fi
          fi

          if [ "${detected}" -eq 1 ]; then
            run_bundling="$(node scripts/ci-bundling-gate.mjs --paths-file "${paths_file}")"
          else
            echo "::warning::Could not resolve a changed-path base (unborn ref, force push, or fetch failure); running bundling verification (fail closed)."
            run_bundling=true
          fi

          echo "run_bundling=${run_bundling}" >> "$GITHUB_OUTPUT"
          echo "Bundling verification will run: ${run_bundling}"

  # Conditional job: skipped (not pending) unless a bundling input changed.
  # Under branch protection the required check must be the always-running
  # `windows` job, never this job; see docs/ci-and-release.md.
  bundling-verification:
    name: NSIS bundling verification
    needs: bundling-inputs
    if: needs.bundling-inputs.outputs.run_bundling == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Warsaw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install and verify npm
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm12" npm@12.0.2 --ignore-scripts
          export PATH="$(cygpath -u "$RUNNER_TEMP")/npm12:$PATH"
          test "$(node --version)" = v24.19.0
          test "$(npm --version)" = 12.0.2
          echo "$RUNNER_TEMP/npm12" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci --strict-allow-scripts

      - name: Setup stable Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The Tauri CLI is invoked directly: the default pwsh shell and
      # `npm run` both swallow `--` separators, which dropped the `--` that
      # hands `--locked` to Cargo and made the tauri CLI reject the build.
      - name: Tauri build (NSIS installer)
        shell: bash
        run: ./node_modules/.bin/tauri build -- --locked

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: rate-limits-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error